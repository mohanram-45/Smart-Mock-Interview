<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART MOCK INTERVIEW ASSISTANT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<style>
    /* ════════════════════════════════════════════════════════════════
       DESIGN TOKENS — deep navy-black theme, soft blue ambient glow,
       blue → violet → rose gradient accent.
       ════════════════════════════════════════════════════════════════ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-display: 'Outfit', var(--font-sans);

        --bg: #04060e;
        --surface: #10131f;
        --surface-2: #171b2b;
        --glass: rgba(255, 255, 255, 0.045);
        --glass-2: rgba(255, 255, 255, 0.07);

        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.16);

        --text: #eceef7;
        --text-2: #a8b0c8;
        --text-3: #667090;

        --g1: #4c8dff;
        --g2: #9b72cb;
        --g3: #d96570;
        --grad: linear-gradient(120deg, #4c8dff 0%, #9b72cb 55%, #d96570 100%);

        --accent: #4c8dff;
        --accent-600: #6ea3ff;
        --accent-100: rgba(76, 141, 255, 0.18);
        --accent-50: rgba(76, 141, 255, 0.10);

        --success: #34d399;
        --success-100: rgba(52, 211, 153, 0.15);
        --warning: #fbbf24;
        --warning-100: rgba(251, 191, 36, 0.14);
        --danger: #f4707f;
        --danger-100: rgba(244, 112, 127, 0.15);

        --r-sm: 10px;
        --r-md: 16px;
        --r-lg: 24px;
        --r-full: 999px;

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 18px 50px rgba(0, 0, 0, 0.55), 0 4px 14px rgba(0, 0, 0, 0.35);
        --glow-blue: 0 0 40px rgba(76, 141, 255, 0.22);

        --col-width: 840px;
    }

    html, body { height: 100%; }

    body {
        font-family: var(--font-sans);
        color: var(--text);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
    }

    ::selection { background: rgba(76, 141, 255, 0.35); color: #fff; }

    /* ── AMBIENT GLOW — the big soft blue halo behind everything ── */
    .glow {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
            radial-gradient(60rem 38rem at 50% 58%, rgba(41, 74, 217, 0.26), transparent 60%),
            radial-gradient(36rem 24rem at 50% 62%, rgba(64, 100, 255, 0.14), transparent 55%),
            radial-gradient(40rem 26rem at 85% -8%, rgba(155, 114, 203, 0.08), transparent 60%);
    }

    .app {
        position: relative;
        z-index: 1;
        height: 100dvh;
        display: flex;
        flex-direction: column;
    }

    /* ── HEADER ─────────────────────────────────────────────── */
    .chat-header {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 72px;
        padding: 14px max(24px, calc((100% - 1180px) / 2));
        background: rgba(4, 6, 14, 0.55);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--border);
        position: relative;
        z-index: 10;
    }

    .bot-avatar {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: var(--glass-2);
        border: 1px solid var(--border);
    }
    .bot-avatar svg { width: 24px; height: 24px; }

    /* ── PROMPT-CURSOR BRAND MARK  ( >▌ = "your turn" ) ─────── */
    .pm-gt {
        font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-weight: 800;
        line-height: 1;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
    }
    .pm-caret {
        display: inline-block;
        background: var(--grad);
        border-radius: 2px;
        animation: caretBlink 1.1s steps(1) infinite;
    }
    @keyframes caretBlink {
        0%, 55% { opacity: 1; }
        56%, 100% { opacity: 0; }
    }

    /* Growth mark — circle + rising arrow: the candidate, moving up */
    .growth-mark svg { width: 26px; height: 26px; overflow: visible; }
    .grow-arrow {
        animation: riseLoop 3s ease-in-out infinite;
    }
    @keyframes riseLoop {
        0%   { transform: translateY(5px); opacity: 0; }
        22%  { transform: translateY(0);   opacity: 1; }
        68%  { transform: translateY(0);   opacity: 1; }
        84%  { transform: translateY(-5px); opacity: 0; }
        100% { transform: translateY(5px); opacity: 0; }
    }

    .header-text { flex: 1; min-width: 0; }
    .header-title {
        font-family: var(--font-display);
        font-size: 16.5px;
        font-weight: 700;
        letter-spacing: -0.02em;
    }
    .header-subtitle { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }

    .header-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-left: auto;
        padding: 7px 13px;
        border-radius: var(--r-full);
        background: var(--success-100);
        color: var(--success);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
    }
    .header-status::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5);
        animation: pulse 2.4s infinite;
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.45); }
        70% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
        100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    .compare-models-btn {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 15px;
        background: var(--glass);
        color: var(--text-2);
        border: 1px solid var(--border);
        border-radius: var(--r-full);
        font-family: inherit;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.2s;
    }
    .compare-models-btn:hover {
        background: var(--accent-50);
        color: var(--accent-600);
        border-color: rgba(76, 141, 255, 0.4);
        box-shadow: var(--glow-blue);
    }
    .compare-models-btn svg { width: 15px; height: 15px; }

    /* ── MESSAGES ───────────────────────────────────────────── */
    .messages {
        flex: 1;
        overflow-y: auto;
        width: 100%;
        max-width: var(--col-width);
        margin: 0 auto;
        padding: 32px 28px 48px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        scrollbar-gutter: stable;
    }

    /* ── HERO (welcome state) ───────────────────────────────── */
    .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: max(7vh, 34px) 8px 10px;
        transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .hero.gone { opacity: 0; transform: translateY(-14px); pointer-events: none; }

    /* Mini terminal window — types & deletes commands on loop */
    .hero-term {
        width: min(320px, 84vw);
        border-radius: 14px;
        background: rgba(9, 12, 22, 0.85);
        border: 1px solid var(--border-strong);
        box-shadow: 0 0 44px rgba(76, 141, 255, 0.25), 0 18px 50px rgba(0, 0, 0, 0.5), inset 0 1px rgba(255, 255, 255, 0.06);
        margin-bottom: 30px;
        overflow: hidden;
        text-align: left;
        animation: markFloat 5.5s ease-in-out infinite;
    }
    .term-bar {
        display: flex;
        gap: 6px;
        padding: 10px 13px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
    }
    .term-bar span { width: 10px; height: 10px; border-radius: 50%; }
    .term-bar span:nth-child(1) { background: #ff5f57; }
    .term-bar span:nth-child(2) { background: #febc2e; }
    .term-bar span:nth-child(3) { background: #28c840; }
    .term-body {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 15px 16px 17px;
        font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
        font-size: 14.5px;
        min-height: 50px;
        white-space: nowrap;
    }
    .term-body .pm-gt { font-size: 15px; flex-shrink: 0; }
    .term-cmd {
        font-weight: 600;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
    }
    .term-body .pm-caret { width: 7px; height: 16px; margin-left: 1px; flex-shrink: 0; }
    @keyframes markFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
    }

    /* Typewriter caret at the end of the hero heading */
    .type-caret {
        display: inline-block;
        width: 5px;
        height: 0.92em;
        margin-left: 7px;
        vertical-align: -0.06em;
        background: var(--grad);
        border-radius: 2px;
        animation: caretBlink 1.1s steps(1) infinite;
    }

    .hero h1 {
        font-family: var(--font-display);
        font-size: clamp(32px, 4.8vw, 48px);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.15;
        background: linear-gradient(120deg, #eceef7 0%, #4c8dff 34%, #9b72cb 58%, #d96570 82%, #eceef7 100%);
        background-size: 220% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        animation: shimmer 7s linear infinite;
    }
    @keyframes shimmer {
        to { background-position: 220% center; }
    }

    .hero p {
        margin-top: 14px;
        max-width: 520px;
        font-size: 15px;
        line-height: 1.65;
        color: var(--text-2);
    }
    .hero .hint { color: var(--text-3); font-size: 13px; margin-top: 8px; }

    .hero .quick-replies {
        justify-content: center;
        margin: 30px 0 0;
        max-width: 640px;
    }

    /* ── MESSAGE ROWS ───────────────────────────────────────── */
    .msg-row {
        display: flex;
        gap: 12px;
        max-width: 100%;
        animation: fadeUp 0.3s ease-out;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.bot { align-self: flex-start; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }

    .bubble {
        padding: 13px 17px;
        border-radius: var(--r-md);
        font-size: 15px;
        line-height: 1.65;
        max-width: min(76vw, 620px);
        word-wrap: break-word;
        white-space: pre-wrap;
    }

    .msg-row.bot .bubble {
        background: var(--glass);
        border: 1px solid var(--border);
        border-top-left-radius: 5px;
        color: var(--text);
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow-sm);
    }

    .msg-row.user .bubble {
        background: linear-gradient(135deg, rgba(76, 141, 255, 0.28), rgba(155, 114, 203, 0.26));
        border: 1px solid rgba(120, 140, 255, 0.28);
        color: #fff;
        border-top-right-radius: 5px;
        box-shadow: 0 8px 26px rgba(56, 92, 255, 0.14);
    }

    .msg-tag {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 10.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        margin-bottom: 8px;
    }
    .msg-tag::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--grad);
        flex-shrink: 0;
        box-shadow: 0 0 8px rgba(76, 141, 255, 0.8);
    }

    .system-msg {
        align-self: center;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--text-2);
        background: var(--glass);
        border: 1px solid var(--border);
        backdrop-filter: blur(8px);
        padding: 7px 16px;
        border-radius: var(--r-full);
        text-align: center;
        animation: fadeUp 0.3s ease-out;
    }

    /* Typing indicator */
    .typing-bubble {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 16px 17px;
    }
    .typing-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        animation: bounce 1.2s infinite;
    }
    .typing-dot:nth-child(1) { background: var(--g1); }
    .typing-dot:nth-child(2) { background: var(--g2); animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { background: var(--g3); animation-delay: 0.3s; }
    @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
        30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Quick replies */
    .quick-replies {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 2px 0 0;
        max-width: min(84vw, 640px);
        animation: fadeUp 0.3s ease-out;
    }
    .chip {
        padding: 11px 18px;
        border-radius: var(--r-full);
        border: 1px solid var(--border);
        background: var(--glass);
        backdrop-filter: blur(10px);
        color: var(--text-2);
        font-family: inherit;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.12s ease, box-shadow 0.2s ease;
    }
    .chip:hover {
        background: var(--accent-50);
        border-color: rgba(76, 141, 255, 0.5);
        color: #fff;
        transform: translateY(-2px);
        box-shadow: var(--glow-blue);
    }
    .chip.active {
        background: linear-gradient(135deg, rgba(76, 141, 255, 0.32), rgba(155, 114, 203, 0.32));
        border-color: rgba(120, 140, 255, 0.55);
        color: #fff;
    }
    .chip.confirm {
        background: linear-gradient(135deg, #2fa77c, #1d7a59);
        border-color: transparent;
        color: #fff;
    }
    .chip.confirm:hover { box-shadow: 0 0 30px rgba(52, 211, 153, 0.3); }
    .chip:disabled, .chip.disabled {
        opacity: 0.35;
        cursor: not-allowed;
        pointer-events: none;
        transform: none;
        box-shadow: none;
    }

    /* ── REPORT CARD ────────────────────────────────────────── */
    .report-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        max-width: min(92vw, 660px);
        width: 100%;
        overflow: hidden;
        box-shadow: var(--shadow-md);
        position: relative;
    }
    .report-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: var(--grad);
    }

    .report-header {
        padding: 28px 28px 24px;
        background:
            radial-gradient(24rem 12rem at 12% 0%, rgba(76, 141, 255, 0.13), transparent 70%),
            radial-gradient(20rem 10rem at 95% 100%, rgba(217, 101, 112, 0.08), transparent 70%);
        border-bottom: 1px solid var(--border);
    }
    .report-kicker {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        margin-bottom: 16px;
    }

    .report-hero { display: flex; align-items: center; gap: 20px; }

    .score-ring {
        --pct: 0;
        --band: var(--accent);
        --band-soft: var(--accent-100);
        width: 78px;
        height: 78px;
        border-radius: 50%;
        flex-shrink: 0;
        background: conic-gradient(var(--band) calc(var(--pct) * 3.6deg), var(--band-soft) calc(var(--pct) * 3.6deg + 0.5deg));
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        filter: drop-shadow(0 0 14px rgba(76, 141, 255, 0.25));
    }
    .score-ring::before {
        content: '';
        position: absolute;
        inset: 6px;
        background: var(--surface);
        border-radius: 50%;
    }
    .report-hero-info { min-width: 0; }
    .hero-role {
        font-family: var(--font-display);
        font-size: 17px;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.015em;
    }
    .hero-domains { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
    .badge {
        display: inline-block;
        margin-top: 7px;
        padding: 4px 11px;
        border-radius: var(--r-full);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
    }
    .badge-excellent { background: var(--success-100); color: var(--success); }
    .badge-good { background: var(--accent-100); color: var(--accent-600); }
    .badge-needs { background: var(--danger-100); color: var(--danger); }

    .hero-substats {
        margin-top: 9px;
        font-size: 12px;
        color: var(--text-3);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    .hero-substats .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }

    .report-section { padding: 20px 28px; border-bottom: 1px solid var(--border); }
    .report-section:last-of-type { border-bottom: none; }
    .report-section h3 {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--text-2);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 12px;
    }

    .report-card ul { list-style: none; font-size: 13.5px; line-height: 1.65; color: var(--text-2); }
    .report-card li {
        position: relative;
        padding-left: 18px;
        margin-bottom: 9px;
    }
    .report-card li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 8px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px rgba(76, 141, 255, 0.6);
    }
    .report-card ul.list-flag li::before { background: var(--danger); box-shadow: 0 0 8px rgba(244, 112, 127, 0.5); }
    .report-card li:last-child { margin-bottom: 0; }
    .report-card li strong { color: var(--text); }
    .report-card li .li-meta { color: var(--text-3); }

    .pill-empty {
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--success-100);
        color: var(--success);
        border-radius: var(--r-md);
        padding: 11px 15px;
        font-size: 13px;
        font-weight: 600;
    }
    .pill-empty::before { content: '✓'; font-weight: 800; }

    .plan-dropdown summary {
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 700;
        color: var(--text-2);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 8px;
        user-select: none;
    }
    .plan-dropdown summary::-webkit-details-marker { display: none; }
    .plan-dropdown summary::before {
        content: '';
        width: 0; height: 0;
        border-left: 5px solid var(--accent);
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        transition: transform 0.15s ease;
        flex-shrink: 0;
    }
    .plan-dropdown[open] summary::before { transform: rotate(90deg); }

    .plan-phase {
        padding: 14px 0 2px 14px;
        margin-top: 14px;
        border-left: 2px solid rgba(76, 141, 255, 0.3);
    }
    .plan-phase .phase-title { font-weight: 700; font-size: 13px; color: var(--text); margin-bottom: 2px; }
    .plan-phase .phase-focus { font-size: 11.5px; color: var(--text-3); margin-bottom: 9px; }

    .report-footnote {
        margin-top: 12px;
        font-size: 11.5px;
        color: var(--text-3);
    }

    .technical-focus-grid { display: grid; gap: 12px; }
    .technical-focus-item {
        padding: 15px;
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        background: var(--glass);
    }
    .technical-focus-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .technical-terms { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
    .technical-term {
        padding: 4px 10px;
        border: 1px solid rgba(76, 141, 255, 0.3);
        border-radius: var(--r-full);
        background: var(--accent-50);
        color: var(--accent-600);
        font-size: 10.5px;
        font-weight: 700;
    }
    .technical-detail { margin-top: 7px; font-size: 12.5px; line-height: 1.6; color: var(--text-2); }
    .technical-detail strong { color: var(--text); }

    .restart-btn {
        display: block;
        width: calc(100% - 56px);
        margin: 20px 28px 26px;
        padding: 13px;
        border: none;
        border-radius: 14px;
        background: var(--grad);
        color: #fff;
        font-family: inherit;
        font-weight: 700;
        font-size: 13.5px;
        cursor: pointer;
        letter-spacing: 0.01em;

    /* ── EMAIL MODAL ────────────────────────────────────────── */

    /* ── COMPOSER — floating pill ───────────────────────────── */
    .input-bar {

    .tool-btn {

    /* Model indicator — small and out of the way, like Claude's model
       label above the composer, not a competing pill next to send. */
    .model-select { position: relative; flex-shrink: 0; }

    .model-select-trigger {
        display: inline-flex;
        align-items: center;

    /* Focus-visible (keyboard nav) */
    .chip:focus-visible,
    .tool-btn:focus-visible,
    .send-btn:focus-visible,

    .report-action-btn:focus-visible,

    /* Scrollbar */

    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: var(--r-full); }
    .messages::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

    @media (max-width: 700px) {
        .chat-header { min-height: 64px; padding: 12px 16px; gap: 11px; }
        .header-status { display: none; }
        .compare-models-btn { width: 40px; height: 40px; padding: 0; justify-content: center; }
        .compare-models-btn span { display: none; }

        .hero .quick-replies { margin: 26px 0 0; }

        .model-select-menu { width: 270px; }
        .composer-hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
</style>

<body>
<div class="glow" aria-hidden="true"></div>

<div class="email-modal" id="emailModal" role="dialog" aria-modal="true" aria-labelledby="emailModalTitle">
    <div class="email-dialog">

<div class="app">

                    <linearGradient id="growGrad" x1="3" y1="21" x2="21" y2="3" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#4c8dff"/>

                        <stop offset="1" stop-color="#d96570"/>

                <g class="grow-arrow">
                    <path d="M12 16.2V8.6M8.7 11.9 12 8.6l3.3 3.3" stroke="url(#growGrad)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>

        </div>
        <div class="header-status">Coach ready</div>
        <button class="compare-models-btn" type="button" onclick="openTopicCompare()">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 19V5M4 19h16M4 19l5-6 4 3 6-8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>

                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

            <div class="input-row">
                <textarea id="answerInput" placeholder="Type your answer here…" disabled rows="1"></textarea>
                <button class="send-btn" id="sendBtn" onclick="submitAnswer()" disabled>
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 11.5L20.5 3.5C21.2 3.2 21.9 3.9 21.6 4.6L14.5 21.5C14.2 22.2 13.2 22.2 12.9 21.4L10.6 15.4L4.6 13.1C3.8 12.8 3.8 11.8 3 11.5Z" fill="currentColor"/><path d="M10.7 15.3L20.6 4.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                </button>
            </div>
            <div class="composer-hint"><kbd>Enter</kbd> to send&ensp;·&ensp;<kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line</div>

</div>

<script>
const API_URL = 'http://localhost:5000/api';

let currentSession = null;
let currentRole = null;
let allRoles = {};
let allDomains = [];
let allModels = [];
let selectedModel = null;
let selectedModelLabel = null;
let modelMenuOpen = false;
let modelLocked = false;
let currentRound = 'Easy';
let roundQuestionCounts = { Easy: 0, Medium: 0, Hard: 0 };
let currentRoundQuestion = 0;
let totalQuestionsAsked = 0;
let isBusy = false;
let selectedCustomDomains = new Set();
let completedReportId = null;
let consecutiveSkips = 0;
let lastSkipReply = '';
const skipReplies = [
    'That’s okay — let’s try the next question.',
    'No problem — we’ll move to another topic.',
    'All right — let’s continue with the next one.',
    'Understood — here comes the next question.',
    'That’s fine — let’s keep the interview moving.',
    'We can leave that one for now — moving on.',
    'Noted — let’s see how you do on the next topic.',
    'Okay — we’ll continue with a different question.',
    'Skipped for now — let’s go to the next one.',
    'No worries — let’s move forward.'
];

function getSkipReply() {
    const availableReplies = skipReplies.filter(reply => reply !== lastSkipReply);
    const reply = availableReplies[Math.floor(Math.random() * availableReplies.length)];
    lastSkipReply = reply;
    return reply;
}

const messagesEl = document.getElementById('messages');
const answerInput = document.getElementById('answerInput');
const sendBtn = document.getElementById('sendBtn');
const repeatBtn = document.getElementById('repeatBtn');
const skipBtn = document.getElementById('skipBtn');

const roleIcons = {
    'Data Scientist': '👨‍💼',
    'Machine Learning Engineer': '🤖',
    'NLP Engineer': '🗣️',
    'Data Analyst': '📊',
    'Data Engineer': '⚙️',
    'Python Developer': '🐍',
    'SQL Developer': '🗄️',
    'Custom Interview': '✨'
};

// Backend domain codes are short/technical (ML, DL, DATA_ANALYSIS...) -
// humanize them for display only. The raw code is still what's sent to
// the API; this map is purely cosmetic.
const domainLabels = {
    'ML': 'Machine Learning',
    'DL': 'Deep Learning',
    'NLP': 'NLP',
    'DATA_ANALYSIS': 'Data Analysis',
    'Python': 'Python'
};
function humanizeDomain(code) {
    if (!code) return code;
    if (domainLabels[code]) return domainLabels[code];
    return code.replace(/_/g, ' ').replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
}

// ────────────────────────────────────────────────────────────────────
// SHARED AVATAR MARKUP (prompt-cursor mark:  >▌  = "your turn")
// ────────────────────────────────────────────────────────────────────
const CHEVRON_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const LOCK_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;

// ────────────────────────────────────────────────────────────────────
// MESSAGE RENDERING HELPERS
// ────────────────────────────────────────────────────────────────────

function scrollToBottom() {
    requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

function addBotMessage(html, opts = {}) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
        <div>
            <div class="bubble">${opts.tag ? `<span class="msg-tag">${opts.tag}</span>` : ''}${html}</div>
            ${opts.extraHtml || ''}
        </div>
    `;
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
}

function addUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `<div class="bubble"></div>`;
    row.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
}

function addSystemMessage(text) {
    const el = document.createElement('div');
    el.className = 'system-msg';
    el.textContent = text;
    messagesEl.appendChild(el);
    scrollToBottom();
    return el;
}

function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typingRow';
    row.innerHTML = `
        <div class="bubble typing-bubble">
            <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
        </div>
    `;
    messagesEl.appendChild(row);
    scrollToBottom();
}

function hideTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
}

function addQuickReplies(container, options, { multiSelect = false, confirmLabel = null, onSelect, onConfirm } = {}) {
    const wrap = document.createElement('div');
    wrap.className = 'quick-replies';

    options.forEach(opt => {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.textContent = opt.label;
        chip.onclick = () => {
            if (multiSelect) {
                chip.classList.toggle('active');
                onSelect(opt.value, chip.classList.contains('active'));
            } else {
                Array.from(wrap.querySelectorAll('.chip')).forEach(c => c.classList.add('disabled'));
                chip.classList.add('active');
                onSelect(opt.value);
            }
        };
        wrap.appendChild(chip);
    });

    if (confirmLabel) {
        const confirmChip = document.createElement('button');
        confirmChip.className = 'chip confirm';
        confirmChip.textContent = confirmLabel;
        confirmChip.onclick = () => {
            Array.from(wrap.querySelectorAll('.chip')).forEach(c => c.classList.add('disabled'));
            onConfirm();
        };
        wrap.appendChild(confirmChip);
    }

    container.appendChild(wrap);
    scrollToBottom();
    return wrap;
}

// ────────────────────────────────────────────────────────────────────
// HERO (welcome screen shown before the interview starts)
// ────────────────────────────────────────────────────────────────────

function buildHero() {
    const hero = document.createElement('div');
    hero.className = 'hero';
    hero.id = 'hero';
    hero.innerHTML = `
        <div class="hero-term">
            <div class="term-bar"><span></span><span></span><span></span></div>
            <div class="term-body">
                <span class="pm-gt">&gt;</span><span class="term-cmd" id="termType"></span><span class="pm-caret"></span>
            </div>
        </div>
        <h1><span id="heroType"></span><span class="type-caret"></span></h1>
        <p>I'll run you through an adaptive technical mock interview — questions get harder as you get better. Pick a role to begin.</p>
        <p class="hint">You can switch the scoring model in the message bar below before we start.</p>
    `;
    messagesEl.appendChild(hero);

    // Heading types itself out once, terminal-style
    const target = hero.querySelector('#heroType');
    const phrase = 'Practice. Improve. Get hired.';
    let i = 0;
    (function typeNext() {
        if (!target.isConnected) return; // hero was dismissed mid-typing
        target.textContent = phrase.slice(0, i);
        if (i < phrase.length) {
            i++;
            setTimeout(typeNext, 75);
        }
    })();

    // Mini terminal: types a command, holds, deletes it, types the next — forever
    const termTarget = hero.querySelector('#termType');
    const cmds = [
        'interview.start()',
        'skills.assess()',
        'confidence.build()',
        'offer.unlock()',
        'resume.polish()',
        'fear.delete()',
        'doubt.remove()',
        'answers.sharpen()',
        'knowledge.load()',
        'imposter.uninstall()',
        'grit.install()',
        'mindset.upgrade()',
        'weakness.patch()',
        'feedback.apply()',
        'growth.compile()',
        'focus.lock()',
        'limits.break()',
        'nerves.debug()',
        'practice.repeat()',
        'curiosity.push()',
        'dream_job.fetch()',
        'hr_round.clear()',
        'tech_round.crush()',
        'salary.negotiate()',
        'success.commit()',
        'goals.deploy()',
        'potential.unleash()',
        'career.level_up()',
        'rejection.retry()',
        'yourself.believe()',
        'future.build()'
    ];
    let ci = 0, pos = 0, deleting = false;
    (function termLoop() {
        if (!termTarget.isConnected) return; // hero dismissed — stop the loop
        const cmd = cmds[ci];
        termTarget.textContent = cmd.slice(0, pos);
        let delay;
        if (!deleting) {
            if (pos < cmd.length) { pos++; delay = 65 + Math.random() * 55; }
            else { deleting = true; delay = 1500; }
        } else {
            if (pos > 0) { pos--; delay = 28; }
            else { deleting = false; ci = (ci + 1) % cmds.length; delay = 500; }
        }
        setTimeout(termLoop, delay);
    })();

    return hero;
}

function dismissHero() {
    const hero = document.getElementById('hero');
    if (!hero) return;
    hero.classList.add('gone');
    setTimeout(() => hero.remove(), 380);
}

// ────────────────────────────────────────────────────────────────────
// MODEL SELECTOR - default Sentence-BERT, switchable until the
// interview starts, then locked read-only for the rest of the session.
// ────────────────────────────────────────────────────────────────────

function renderModelOptions() {
    const menu = document.getElementById('modelSelectMenu');
    menu.innerHTML = allModels.map(m => `
        <button type="button" class="model-option ${m.key === selectedModel ? 'selected' : ''}" onclick="chooseModel('${m.key}')">
            <span class="model-option-name">${m.label}</span>
            <span class="model-option-desc">${m.description}</span>
        </button>
    `).join('');
}

function updateModelTrigger() {
    document.getElementById('modelSelectName').textContent = selectedModelLabel || 'Select model';
}

function toggleModelMenu(e) {
    if (modelLocked) return;
    if (e) e.stopPropagation();
    modelMenuOpen = !modelMenuOpen;
    document.getElementById('modelSelect').classList.toggle('open', modelMenuOpen);
}

function chooseModel(key) {
    if (modelLocked) return;
    const model = allModels.find(m => m.key === key);
    if (!model) return;
    selectedModel = key;
    selectedModelLabel = model.label;
    updateModelTrigger();
    renderModelOptions();
    modelMenuOpen = false;
    document.getElementById('modelSelect').classList.remove('open');
}

function lockModelSelector() {
    modelLocked = true;
    modelMenuOpen = false;
    const sel = document.getElementById('modelSelect');
    sel.classList.remove('open');
    sel.classList.add('locked');
    document.getElementById('modelSelectIcon').innerHTML = LOCK_SVG;
}

document.addEventListener('click', (e) => {
    const sel = document.getElementById('modelSelect');
    if (sel && modelMenuOpen && !sel.contains(e.target)) {
        modelMenuOpen = false;
        sel.classList.remove('open');
    }
});

    window.open('http://localhost:5050/topic-compare', '_blank');

// ────────────────────────────────────────────────────────────────────
// INITIALIZATION
// ────────────────────────────────────────────────────────────────────

async function init() {
    const hero = buildHero();
    try {
        const rolesRes = await fetch(`${API_URL}/roles`);
        const rolesData = await rolesRes.json();
        allRoles = rolesData.role_mappings;

        const domainsRes = await fetch(`${API_URL}/domains`);
        const domainsData = await domainsRes.json();
        allDomains = domainsData.domains;

        const modelsRes = await fetch(`${API_URL}/models`);
        const modelsData = await modelsRes.json();
        allModels = modelsData.models;

        const defaultModel = allModels.find(m => m.key === 'bert') || allModels[0];
        if (defaultModel) {
            selectedModel = defaultModel.key;
            selectedModelLabel = defaultModel.label;
        }
        updateModelTrigger();
        renderModelOptions();

        askForRole(hero);
    } catch (error) {
        addBotMessage('⚠️ Failed to load interview data: ' + error.message);
    }
}

function askForRole(container) {
    const options = Object.keys(allRoles).map(role => ({
        label: `${roleIcons[role] || '📋'} ${role}`,
        value: role
    }));

    addQuickReplies(container || messagesEl, options, {
        onSelect: (role) => {
            dismissHero();
            addUserMessage(role);
            selectRole(role);
        }
    });
}

function selectRole(role) {
    currentRole = role;
    if (role === 'Custom Interview') {
        showCustomDomainPicker();
    } else {
        startInterview(role, []);
    }
}

function showCustomDomainPicker() {
    addBotMessage('Great — pick one or more domains, then tap "Start Interview".');
    selectedCustomDomains = new Set();

    const options = allDomains.map(domain => ({ label: humanizeDomain(domain), value: domain }));
    addQuickReplies(messagesEl, options, {
        multiSelect: true,
        confirmLabel: 'Start Interview ▶',
        onSelect: (domain, isActive) => {
            if (isActive) selectedCustomDomains.add(domain);
            else selectedCustomDomains.delete(domain);
        },
        onConfirm: () => {
            if (selectedCustomDomains.size === 0) {
                addBotMessage('Please select at least one domain first.');
                return;
            }
            const chosen = Array.from(selectedCustomDomains);
            addUserMessage(chosen.map(humanizeDomain).join(', '));
            startInterview('Custom Interview', chosen);
        }
    });
}

// ────────────────────────────────────────────────────────────────────
// INTERVIEW FLOW
// ────────────────────────────────────────────────────────────────────

function roleSubtitle(role) {
    // Avoid "Custom Interview interview in progress" - some role names
    // already contain the word "interview".
    return /interview/i.test(role) ? `${role} in progress` : `${role} interview in progress`;
}

async function startInterview(role, customDomains) {
    consecutiveSkips = 0;
    lastSkipReply = '';
    if (isBusy) return;
    isBusy = true;
    lockModelSelector(); // model choice is final the moment the interview starts
    showTyping();
    try {
        const body = { role, model: selectedModel };
        if (customDomains.length > 0) body.custom_domains = customDomains;

        const res = await fetch(`${API_URL}/start-interview`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        hideTyping();

        if (!res.ok) {
            addBotMessage('⚠️ ' + (data.error || 'Failed to start interview'));
            return;
        }

        currentSession = data.session_id;
        currentRound = data.current_round;
        roundQuestionCounts = { Easy: 0, Medium: 0, Hard: 0 };
        totalQuestionsAsked = 0;

        document.getElementById('headerSubtitle').textContent = roleSubtitle(role);

        addBotMessage(`Let's begin! Good luck! 🚀`);
        loadQuestion(data.current_question);
    } catch (error) {
        hideTyping();
        addBotMessage('⚠️ Connection error: ' + error.message);
    } finally {
        isBusy = false;
    }
}

function loadQuestion(question) {
    if (!question) return;

    currentRoundQuestion = question.question_number;
    roundQuestionCounts[currentRound] = question.total_in_round;
    totalQuestionsAsked += 1;

    addBotMessage(question.question, {
        tag: `Question ${totalQuestionsAsked}`
    });

    setInputEnabled(true);
    answerInput.focus();
}

async function submitAnswer() {
    const answer = answerInput.value.trim();
    if (!answer || isBusy) return;

    consecutiveSkips = 0;

    addUserMessage(answer);
    answerInput.value = '';
    autoGrow();
    setInputEnabled(false);
    isBusy = true;
    showTyping();

    try {
        const res = await fetch(`${API_URL}/submit-answer`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: currentSession, answer })
        });
        const data = await res.json();
        hideTyping();

        if (!res.ok) {
            addBotMessage('⚠️ ' + (data.error || 'Failed to submit answer'));
            setInputEnabled(true);
            isBusy = false;
            return;
        }

        // Feedback only — no score is shown to the candidate during the interview.
        addBotMessage(data.feedback);

        await checkRoundCompletion();
    } catch (error) {
        hideTyping();
        addBotMessage('⚠️ Connection error: ' + error.message);
        setInputEnabled(true);
    } finally {
        isBusy = false;
    }
}

async function checkRoundCompletion() {
    try {
        const res = await fetch(`${API_URL}/check-round-completion`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: currentSession })
        });
        const data = await res.json();
        if (!res.ok) return;

        if (data.action === 'continue_round') {
            // Adaptive engine asking one more question in this round - stay
            // silent about it so it doesn't repeat/reveal internal logic.
            if (data.next_question) loadQuestion(data.next_question);
            else getNextQuestion();
        } else if (data.action === 'next_round') {
            currentRound = data.next_round;
            addSystemMessage('Nice work! Let\'s keep going...');
            setTimeout(() => {
                if (data.next_question) loadQuestion(data.next_question);
            }, 900);
        } else if (data.action === 'end_interview') {
            addBotMessage("That's a wrap! Let me put together your report... 📊");
            setTimeout(() => endInterview(), 900);
        } else {
            // Round isn't finished yet - move on to the next question in it.
            getNextQuestion();
        }
    } catch (error) {
        addBotMessage('⚠️ Error checking round progress: ' + error.message);
        setInputEnabled(true);
    }
}

async function getNextQuestion() {
    try {
        const res = await fetch(`${API_URL}/next-question`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: currentSession })
        });
        const data = await res.json();

        if (data.finished) {
            addBotMessage("That's a wrap! Let me put together your report... 📊");
            setTimeout(() => endInterview(), 900);
        } else {
            currentRound = data.current_round;
            loadQuestion(data);
        }
    } catch (error) {
        addBotMessage('⚠️ Failed to load next question: ' + error.message);
    }
}

async function skipQuestion() {
    if (isBusy) return;
    isBusy = true;
    addUserMessage('(skipped)');
    setInputEnabled(false);
    showTyping();
    try {
        const res = await fetch(`${API_URL}/skip-question`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: currentSession })
        });
        hideTyping();
        if (res.ok) {
            const result = await res.json();
            const backendCount = Number(result.consecutive_skips);
            consecutiveSkips = Number.isFinite(backendCount) ? backendCount : consecutiveSkips + 1;
            if (result.force_end === true || consecutiveSkips >= 5) {
                addBotMessage('You skipped five questions in a row, so I’ll end this attempt and build a preparation report from the evidence available.');
                addBotMessage("Let me put together your personalized report... 📊");
                await endInterview();
            } else {
                addBotMessage(getSkipReply());
                await checkRoundCompletion();
            }
        } else {
            setInputEnabled(true);
        }
    } catch (error) {
        hideTyping();
        addBotMessage('⚠️ Error skipping question: ' + error.message);
        setInputEnabled(true);
    } finally {
        isBusy = false;
    }
}

async function repeatQuestion() {
    if (isBusy) return;
    try {
        const res = await fetch(`${API_URL}/repeat-question?session_id=${currentSession}`);
        const data = await res.json();
        if (res.ok) {
            addBotMessage(data.question, { tag: 'Repeating question' });
        }
    } catch (error) {
        addBotMessage('⚠️ Error repeating question: ' + error.message);
    }
}

async function endInterview() {
    try {
        const res = await fetch(`${API_URL}/end-interview`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: currentSession })
        });
        let report = await res.json();

        if (res.status === 202) {
            addSystemMessage('Building your personalized technical report with Ollama...');
            report = await waitForReport(report.interview_id || currentSession);
        } else if (!res.ok) {
            addBotMessage('⚠️ ' + (report.error || 'Failed to end interview'));
            return;
        }

        if (report && report.analysis) {
            setInputEnabled(false);
            repeatBtn.disabled = true;
            skipBtn.disabled = true;
            renderReport(report);
        } else {
            addBotMessage('⚠️ The report finished without analysis data. Please try again.');
        }
    } catch (error) {
        addBotMessage('⚠️ Report generation error: ' + error.message);
    }
}

async function waitForReport(interviewId) {
    let connectionFailures = 0;
    for (let attempt = 0; attempt < 60; attempt++) {
        await new Promise(resolve => setTimeout(resolve, 5000));
        try {
            const response = await fetch(`${API_URL}/reports/${encodeURIComponent(interviewId)}/status`);
            const result = await response.json();
            connectionFailures = 0;
            if (response.status === 202) continue;
            if (response.ok) return result;
            throw new Error(result.error || 'Report generation failed.');
        } catch (error) {
            connectionFailures++;
            if (connectionFailures >= 4) {
                throw new Error('The report service became unavailable. Restart Flask and check the saved report.');
            }
        }
    }
    throw new Error('Ollama is taking longer than five minutes. The report may still finish in the background.');
}

// ────────────────────────────────────────────────────────────────────
// REPORT RENDERING (built from the backend's real analysis object)
// ────────────────────────────────────────────────────────────────────

function scoreBand(score) {
    if (score >= 75) return { key: 'excellent', label: 'Excellent', var: '--success', softVar: '--success-100' };
    if (score >= 50) return { key: 'good', label: 'Good', var: '--accent', softVar: '--accent-100' };
    return { key: 'needs', label: 'Needs Improvement', var: '--danger', softVar: '--danger-100' };
}

function renderReport(report) {
    const analysis = report.analysis || {};
    const row = document.createElement('div');
    row.className = 'msg-row bot';

    const card = document.createElement('div');
    card.className = 'report-card';

    const modelInfo = allModels.find(m => m.key === report.scoring_model);
    const modelLabel = modelInfo ? modelInfo.label : (selectedModelLabel || report.scoring_model || '');

    const score = report.average_score;
    const band = scoreBand(score);
    // min 0.4% avoids a conic-gradient rendering seam at exactly 0%
    const ringPct = Math.max(0.4, Math.min(100, score));

    // Custom Interview has no fixed domain set, so show what was picked
    const domainsLine = (report.interview_role === 'Custom Interview' && report.selected_domains && report.selected_domains.length)
        ? `<div class="hero-domains">${report.selected_domains.map(humanizeDomain).join(', ')}</div>`
        : '';

    let html = `
        <div class="report-header">
            <div class="report-kicker">Interview Report</div>
            <div class="report-hero">
                <div class="score-ring" style="--pct:${ringPct}; --band:var(${band.var}); --band-soft:var(${band.softVar});"></div>
                <div class="report-hero-info">
                    <div class="hero-role">${report.interview_role || 'Interview'}</div>
                    ${domainsLine}
                    <span class="badge badge-${band.key}">${band.label}</span>
                    <div class="hero-substats">
                        <span>${report.questions_answered} answered</span>
                        <span class="dot"></span>
                        <span>${report.questions_skipped} skipped</span>
                        <span class="dot"></span>
                        <span>Scored with ${modelLabel}</span>
                    </div>
                </div>
            </div>
        </div>
    `;

    const strengths = analysis.strengths || {};
    if (strengths.demonstrated_topics && strengths.demonstrated_topics.length) {
        html += '<div class="report-section"><h3>Demonstrated Strengths</h3><ul>';
        strengths.demonstrated_topics.forEach(item => {
            html += `<li><strong>${item.topic}</strong></li>`;
        });
        html += '</ul></div>';
    }

    // Areas for Improvement - the main content of the report
    const weaknesses = analysis.weaknesses || {};
    const hasWeak = (weaknesses.weak_questions && weaknesses.weak_questions.length) ||
                    (weaknesses.skipped_questions && weaknesses.skipped_questions.length);
    html += '<div class="report-section"><h3>Areas for Improvement</h3>';
    if (hasWeak) {
        html += '<ul class="list-flag">';
        if (weaknesses.domains && weaknesses.domains.length) {
            html += `<li>Weakest area(s): <strong>${weaknesses.domains.map(humanizeDomain).join(', ')}</strong></li>`;
        }
        (weaknesses.weak_questions || []).forEach(q => {
            html += `<li>${q.question}</li>`;
        });
        (weaknesses.skipped_questions || []).forEach(q => {
            html += `<li>Skipped: ${q.question}</li>`;
        });
        html += '</ul>';
    } else {
        html += '<div class="pill-empty">No significant weak areas identified.</div>';
    }
    html += '</div>';

    // Ollama-generated technical curriculum with concrete mastery criteria
    if (analysis.technical_focus && analysis.technical_focus.length) {
        html += `
            <div class="report-section">
                <h3>Technical Study Guide</h3>
                <div class="technical-focus-grid">
                    ${analysis.technical_focus.map(item => `
                        <div class="technical-focus-item">
                            <div class="technical-focus-title">${item.topic}</div>
                            <div class="technical-terms">
                                ${(item.terms || []).map(term => `<span class="technical-term">${term}</span>`).join('')}
                            </div>
                            <div class="technical-detail"><strong>Practice:</strong> ${item.practice_task}</div>
                            <div class="technical-detail"><strong>Mastery check:</strong> ${item.success_criteria}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    // Personalized Learning Plan - collapsible so it doesn't overwhelm the report
    html += `
        <div class="report-section">
            <details class="plan-dropdown">
                <summary>Personalized Learning Plan</summary>
                ${(analysis.learning_plan || []).map(phase => `
                    <div class="plan-phase">
                        <div class="phase-title">${phase.phase}</div>
                        <div class="phase-focus">Focus: ${phase.focus}</div>
                        <ul>${(phase.actions || []).map(a => `<li>${a}</li>`).join('')}</ul>
                    </div>
                `).join('')}
            </details>
        </div>
    `;

    // Recommendations / tips
    html += '<div class="report-section"><h3>Recommendations</h3><ul>';
    (analysis.recommendations || []).forEach(r => { html += `<li>${r}</li>`; });
    html += '</ul>';
    if (analysis.next_assessment_date) {
        html += `<div class="report-footnote">Suggested next assessment: ${analysis.next_assessment_date}</div>`;
    }
    html += '</div>';

    card.innerHTML = html;

    completedReportId = report.interview_id;
    const actions = document.createElement('div');
    actions.className = 'report-actions';
    actions.innerHTML = `
        <button class="report-action-btn" type="button" onclick="downloadReportPdf()">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Download PDF
        </button>
        <button class="report-action-btn primary" type="button" onclick="openEmailModal()">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="m5 8 7 5 7-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Email report
        </button>
        <div class="delivery-status" id="deliveryStatus"></div>
    `;
    card.appendChild(actions);

    const restartBtn = document.createElement('button');
    restartBtn.className = 'restart-btn';
    restartBtn.textContent = 'Take Another Interview';
    restartBtn.onclick = () => location.reload();
    card.appendChild(restartBtn);

    row.appendChild(card);
    messagesEl.appendChild(row);
    scrollToBottom();
}

async function downloadReportPdf() {
    if (!completedReportId) return;
    const status = document.getElementById('deliveryStatus');
    status.className = 'delivery-status';
    status.textContent = 'Preparing your PDF...';
    try {
        const response = await fetch(`${API_URL}/reports/${encodeURIComponent(completedReportId)}/pdf`);
        if (!response.ok) {
            const result = await response.json().catch(() => ({}));
            throw new Error(result.error || 'Unable to generate the PDF.');
        }
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'SMART_Interview_Report.pdf';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        status.className = 'delivery-status success';
        status.textContent = 'PDF downloaded successfully.';
    } catch (error) {
        status.textContent = error instanceof TypeError
            ? 'Cannot reach the report service. Restart the Flask backend and try again.'
            : error.message;
    }
}

function openEmailModal() {
    document.getElementById('emailStatus').textContent = '';
    document.getElementById('emailModal').classList.add('open');
    setTimeout(() => document.getElementById('reportEmail').focus(), 50);
}

function closeEmailModal() {
    document.getElementById('emailModal').classList.remove('open');
}

async function sendReportEmail() {
    const emailInput = document.getElementById('reportEmail');
    const status = document.getElementById('emailStatus');
    const button = document.getElementById('sendEmailBtn');
    const email = emailInput.value.trim();
    if (!emailInput.checkValidity() || !email) {
        status.className = 'email-status';
        status.textContent = 'Enter a valid email address.';
        return;
    }
    button.disabled = true;
    button.textContent = 'Sending...';
    status.textContent = '';
    try {
        const response = await fetch(`${API_URL}/reports/${encodeURIComponent(completedReportId)}/email`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to send the report.');
        status.className = 'email-status success';
        status.textContent = result.message;
        setTimeout(closeEmailModal, 1800);
    } catch (error) {
        status.className = 'email-status';
        status.textContent = error instanceof TypeError
            ? 'Cannot reach the email service. Check that the Flask backend is running.'
            : error.message;
    } finally {
        button.disabled = false;
        button.textContent = 'Send report';
    }
}

document.getElementById('emailModal').addEventListener('click', event => {
    if (event.target.id === 'emailModal') closeEmailModal();
});

// ────────────────────────────────────────────────────────────────────
// UI HELPERS
// ────────────────────────────────────────────────────────────────────

function setInputEnabled(enabled) {
    answerInput.disabled = !enabled;
    sendBtn.disabled = !enabled;
    repeatBtn.disabled = !enabled;
    skipBtn.disabled = !enabled;
}

function autoGrow() {
    answerInput.style.height = 'auto';
    answerInput.style.height = Math.min(150, answerInput.scrollHeight) + 'px';
}

answerInput.addEventListener('input', autoGrow);
answerInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitAnswer();
    }
});

// Initialize on load
init();
