name: CI

# Normal pull-request checks. Everything here runs on a stock GitHub runner with NO GPU, NO live Ollama, NO paid API key, NO private candidate data and
# NO downloaded model checkpoints (HF/Transformers are forced offline; Ollama is pointed at an unreachable address). Heavyweight tests: heavy.yml.
on:
  pull_request:
  push:
    branches: [main, master, Update]      # Stage 13: the working branch is `Update`; it must be checked on every push, not only on pull requests
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  OLLAMA_HOST: "http://127.0.0.1:9"      # unreachable on purpose: any accidental live-LLM call fails fast instead of silently working
  SMART_LLM_PROVIDER: none
  SMART_LLM_ALLOW_PAID: "0"
  SMART_DEMO_LIVE_MODULAR: "0"
  SMART_CODEEVAL_EXEC: ""                 # candidate code is never executed in CI

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install pinned tooling (hash-checked lock)
        run: pip install --require-hashes -r requirements-ci.lock
      - name: Correctness lint (whole repository; rules in pyproject.toml)
        run: python -m ruff check src main scripts tests report_delivery
      - name: Strict lint and formatting (new MLOps files only; legacy and frozen files are not reformatted)
        run: |
          python -m ruff check --select E,F,I --ignore E501 src/mlops tests/mlops scripts/check_integrity.py scripts/healthcheck.py scripts/mlflow_import_history.py scripts/mlflow_log_provenance.py scripts/verify_compose.py scripts/mlops_demo.py scripts/check_versions.py scripts/mlflow_track_retrieval.py scripts/verify_real_index.py
          python -m ruff format --check src/mlops tests/mlops scripts/check_integrity.py scripts/healthcheck.py scripts/mlflow_import_history.py scripts/mlflow_log_provenance.py scripts/verify_compose.py scripts/mlops_demo.py scripts/check_versions.py scripts/mlflow_track_retrieval.py scripts/verify_real_index.py

  security:
    name: Dependency and publication safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tracked files contain no secrets, sessions or private paths (same check as before every commit)
        run: python scripts/check_staged.py --worktree
      - name: Known-vulnerability audit of the CI dependency lock (blocking)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-ci.lock --no-deps --disable-pip
      - name: Audit of the Docker and MLflow locks (reported, not blocking - a fix needs a re-hashed lock and a Docker rebuild)
        continue-on-error: true
        run: |
          pip-audit -r requirements-docker.lock --no-deps --disable-pip
          pip-audit -r requirements-ci-mlops.lock --no-deps --disable-pip

  integrity:
    name: Dataset and frozen-experiment integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install pinned dependencies (hash-checked lock)
        run: pip install --require-hashes -r requirements-ci.lock
      - name: Manifest and fingerprint check (corpus loader, corpus manifest, Stage 3C-2 freeze, bench_v2)
        run: python scripts/check_integrity.py
      - name: Version consistency (corpus, DVC params, served format, frozen files)
        run: python scripts/check_versions.py

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install pinned dependencies (hash-checked lock)
        run: pip install --require-hashes -r requirements-ci.lock
      - name: Retrieval tests
        run: python -m pytest tests/retrieval -q
      - name: Evaluation tests
        run: python -m pytest tests/evaluation -q
      - name: Flask integration tests (legacy routes, demo, end-to-end journeys)
        run: python -m pytest tests/app -q
      - name: Stage 10 scripted evaluation gates (mock candidates, no model, no Ollama)
        run: python scripts/stage10_eval_suite.py --out "${{ runner.temp }}/stage10" --transcripts "${{ runner.temp }}/stage10/t" --review "${{ runner.temp }}/stage10/r" --quick
      - name: Stage 10D-F scripted opportunity gates (stand-in model, no Ollama)
        run: python scripts/stage10f_eval.py --quick --out "${{ runner.temp }}/stage10f" --transcripts "${{ runner.temp }}/stage10f/t" --review "${{ runner.temp }}/stage10f/r"
      - name: Stage 10G-I Windows-evidence replay (no model)
        run: python scripts/stage10g_replay_windows.py --out "${{ runner.temp }}/stage10g"
      - name: Stage 10J-L case-by-case comparison with the recorded Windows runs (no model)
        run: python scripts/stage10l_compare.py --out "${{ runner.temp }}/stage10l"
      - name: Stage 10M trace of the recorded Windows run through the current rules (no model)
        run: python scripts/stage10m_trace.py --results reports/stage10_windows_evidence_2/results.json --out "${{ runner.temp }}/stage10m"
      - name: Stage 10N question-pair validator rates (offline, no model)
        run: python scripts/stage10n_pairs_eval.py --out "${{ runner.temp }}/stage10n_pairs.json"
      - name: Stage 10N Windows-repair diagnostics smoke (BM25 only, no model)
        run: python scripts/stage10n_windows_repair_diag.py --skip-real --out "${{ runner.temp }}/stage10n_windows_repair_diag.json"
      - name: Static code-evaluation tests (no candidate code is executed)
        run: python -m pytest tests/codeeval -q
      - name: Observability and packaging tests
        run: python -m pytest tests/mlops -q

  mlops:
    name: MLflow tracking tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci-mlops.lock
      - name: Install pinned dependencies (hash-checked lock)
        run: pip install --require-hashes -r requirements-ci-mlops.lock
      - name: MLflow import / verify / provenance (local SQLite store in a temp dir; no model is run)
        run: python -m pytest tests/mlops/test_tracking.py -q

  windows:
    name: Windows smoke (lean)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install pinned dependencies (hash-checked lock)
        run: pip install --require-hashes -r requirements-ci.lock
      - name: Manifest and fingerprint check on Windows (line endings, paths)
        run: python scripts/check_integrity.py
      - name: Retrieval, Flask and observability tests on Windows
        run: python -m pytest tests/retrieval tests/app tests/mlops -q
      - name: Environment verifier (in-process; no Docker, no model)
        run: python scripts/verify_mlops.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate the Compose file
        run: docker compose config --quiet
      - name: Build the application image (lean image - no torch, no weights, no credentials)
        run: docker build --build-arg SMART_GIT_COMMIT=${{ github.sha }} -t smart-mock-interview:ci .
      - name: Start it on loopback and verify health (not published beyond the runner)
        run: |
          docker run -d --name smart-ci -p 127.0.0.1:5000:5000 --read-only --tmpfs /tmp -v smart-ci-results:/app/results --cap-drop ALL --security-opt no-new-privileges smart-mock-interview:ci
          for i in $(seq 1 30); do python scripts/healthcheck.py --ready && break; sleep 2; done
          python scripts/healthcheck.py --ready
      - name: Container runs as a non-root user and carries no secrets
        run: |
          test "$(docker exec smart-ci id -u)" != "0"
          # Names only - values are never printed. GPG_KEY is the public key id that python base images set, not an application credential.
          docker exec smart-ci python -c "import os,re,sys; bad=sorted(k for k in os.environ if re.search('key|token|secret|password', k, re.I) and k != 'GPG_KEY'); print('credential-like variable names:', bad); sys.exit(1 if bad else 0)"
      - if: always()
        run: docker logs smart-ci | tail -30

  ci-ok:
    # One required status check for branch protection: fails if any job above failed or was cancelled.
    name: CI gate
    if: always()
    needs: [lint, security, integrity, tests, mlops, windows, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every needed job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          r = {k: v["result"] for k, v in json.loads(os.environ["NEEDS_JSON"]).items()}
          print(r)
          sys.exit(0 if all(v == "success" for v in r.values()) else 1)
          PY
