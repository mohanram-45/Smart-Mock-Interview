<ol class="stages" aria-label="Interview stages">{% for t in tracker %}<li class="stage-step {{ t.state }}"{% if t.state == 'current' %} aria-current="step"{% endif %}><span class="dotc" aria-hidden="true"></span><span class="lbl">{{ t.label }}</span>{% if t.total > 1 %}<small>{{ t.done }}/{{ t.total }}</small>{% endif %}</li>{% endfor %}</ol>
