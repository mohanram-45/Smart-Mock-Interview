# Parameters read by dvc.yaml (stage build_index). They mirror the CLI defaults of `python -m src.retrieval.cli build`, which are the format the application serves (src/retrieval/service.py DOC_MODE; guarded by tests/mlops/test_stage8_consistency.py).
embedding:
  backend: minilm
  doc_mode: qk_concise
  model: sentence-transformers/all-MiniLM-L6-v2
